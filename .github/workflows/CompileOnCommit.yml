name: Android Build CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/lx-airplay2-lite" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest

      # The Lite fork is tested as a debug APK first; never publish an unsigned release.
      - name: Build LX AirPlay Lite debug APK
        run: ./gradlew assembleGithubDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/github/debug/*.apk

